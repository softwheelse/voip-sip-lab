; Softwheelse VoIP & SIP Lab
; Example Asterisk PJSIP configuration
; IMPORTANT: Do not store real credentials in this repository.

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

[example-trunk]
type=endpoint
transport=transport-udp
context=from-pstn
disallow=all
allow=ulaw
allow=alaw
outbound_auth=example-trunk-auth
aors=example-trunk-aor

[example-trunk-auth]
type=auth
auth_type=userpass
username=YOUR_SIP_USERNAME
password=YOUR_SIP_PASSWORD

[example-trunk-aor]
type=aor
contact=sip:sip.telnyx.com:5060
